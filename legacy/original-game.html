<meta charset="utf-8">
<title>Ibis Story Worlds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-bleed low-poly sea map; floating rounded HUD on top; bottom sheet for every step; full-screen dive scene for the mission. One committed sunny look. */
:root{
  --sea:#1fb5c9; --sea-deep:#0b6f8c; --sand:#ffd98a; --palm:#2fae63; --coral:#ff6b5b; --sun:#ffc531;
  --ink:#17324d; --ink-soft:#4d6a83; --card:#fffaf0; --card-2:#fff0d2; --line:#f0dcb4; --plum:#7b4fd6; --pearl:#ffe9f1;
  --good:#2b9b54; --warn:#d9861f; --bad:#d9443a; --white:#ffffff;
  --f-display:"Baloo Bhaijaan 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#8fdcf0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ilabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:2px solid var(--white);box-shadow:0 4px 0 rgba(23,50,77,.18);border-radius:16px;padding:4px 12px 5px;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap;cursor:pointer}
.ilabel small{font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.ilabel.open{background:var(--sun)}
.ilabel.open small{color:var(--ink)}
.ilabel.home{background:var(--plum);color:var(--white)}
.ilabel.home small{color:#e7ddff}
.ilabel.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 rgba(23,50,77,.18),0 0 0 0 rgba(255,197,49,.9)}50%{box-shadow:0 4px 0 rgba(23,50,77,.18),0 0 0 10px rgba(255,197,49,0)}}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.15em}

.topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:var(--gl);right:var(--gr);display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:20}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:4px 14px 4px 6px;box-shadow:0 4px 0 rgba(23,50,77,.18);font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1}
.brand .logo{width:34px;height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:0;border-radius:16px;padding:7px 12px;box-shadow:0 4px 0 rgba(23,50,77,.18);font-weight:800;font-size:13px}
.chip.star{color:#8a5a00}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--palm)}
.spacer{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:16px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(23,50,77,.22);background:var(--plum);color:var(--white)}
.hbtn.alt{background:var(--card);color:var(--ink)}
.hbtn:active,.btn:active,.chip:active{transform:translateY(2px)}
@media (max-width:560px){.hbtn .t,.brand .t{display:none}.brand{padding-right:6px}}

.stepper{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,250,240,.95);border-radius:18px;padding:5px;box-shadow:0 4px 0 rgba(23,50,77,.18);z-index:22;max-width:calc(100% - 32px)}
.stepper .st{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;font-weight:800;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.stepper .st b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card-2);font-size:11px;color:var(--ink)}
.stepper .st.on{background:var(--sun);color:var(--ink)}
.stepper .st.on b{background:var(--white)}
.stepper .st.done b{background:var(--good);color:var(--white)}
@media (max-width:640px){.stepper .st span{display:none}.stepper .st.on span{display:inline}}
.leave{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:var(--gr);z-index:23}

.ibis{position:fixed;left:var(--gl);top:calc(env(safe-area-inset-top,0px) + 112px);max-width:min(400px,calc(100% - 32px));display:flex;gap:10px;align-items:flex-start;z-index:24;pointer-events:none;transition:opacity .25s,transform .25s}
.ibis.hide{opacity:0;transform:translateY(-6px)}
.ibis .av{width:48px;height:48px;flex:none;border-radius:50%;background:var(--white);box-shadow:0 3px 0 rgba(23,50,77,.18);display:grid;place-items:center}
.ibis .bub{background:var(--white);border-radius:4px 18px 18px 18px;padding:9px 13px;box-shadow:0 4px 0 rgba(23,50,77,.16);font-weight:700;font-size:14px}
.ibis .bub .ar{display:block;font-family:var(--f-display);font-size:16px;color:var(--sea-deep);margin-top:2px}

.sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);width:min(600px,calc(100% - 24px));max-height:min(58vh,600px);overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 6px 0 rgba(23,50,77,.18),0 20px 40px rgba(11,111,140,.25);padding:18px 18px 16px;z-index:25;overscroll-behavior:contain}
.sheet.tall{max-height:min(80vh,820px)}
.sheet.slim{max-height:min(46vh,520px)}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.sheet p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.ar{font-family:var(--f-display);direction:rtl}
.eyebrow{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--card-2);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}
.tag.v{background:#ffe1dc;color:#9c2a20}
.tag.s{background:#dff5e7;color:#1d6b3b}
.tag.l{background:#e9e4f9;color:#4d2fa0}
.tag.demo{background:#17324d;color:#fff}
.desc{font-family:var(--f-display);font-size:17px;line-height:1.4;background:var(--pearl);border-radius:16px;padding:10px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:11px 18px;font-weight:800;font-size:15px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c9940f}
.btn.sea{background:var(--sea);color:var(--white);box-shadow:0 4px 0 var(--sea-deep)}
.btn.plum{background:var(--plum);color:var(--white);box-shadow:0 4px 0 #4f2c9c}
.btn.ghost{background:var(--card-2);box-shadow:0 4px 0 var(--line)}
.btn.big{padding:14px 22px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--coral);color:var(--white);box-shadow:0 4px 0 #b6372b}
.x{border:0;background:var(--card-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}

.page{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.line-ar{font-family:var(--f-display);font-size:28px;line-height:1.7;direction:rtl;text-align:right;display:flex;flex-wrap:wrap;gap:2px 8px}
.line-ar.big{font-size:44px;justify-content:center}
.w{border-radius:10px;padding:0 6px;transition:background .2s,color .2s;border:0;background:transparent;font:inherit;line-height:inherit;cursor:pointer}
.w.ok{background:#d6f4e0;color:#145c30}
.w.hard{background:#ffe2c2;color:#8a4a00;box-shadow:inset 0 -3px 0 #f0a347}
.w.now{background:var(--sun)}
.meter{height:12px;border-radius:8px;background:var(--card-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--palm);border-radius:8px;transition:width .3s}
.stars{display:inline-flex;gap:2px;color:var(--sun);font-size:20px}
.stars .off{color:#e8dcc3}
.wave{display:inline-flex;gap:3px;align-items:center;height:24px}
.wave i{width:4px;border-radius:2px;background:var(--coral);animation:lv .5s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
@keyframes lv{from{height:4px}to{height:22px}}

.rh{width:100%;height:150px;display:block;border-radius:16px;background:#0f3b63;touch-action:manipulation}
.tap{width:100%;padding:18px;font-size:20px}

.back{position:fixed;inset:0;background:rgba(11,60,90,.45);display:grid;place-items:center;z-index:40;padding:16px var(--gr) 16px var(--gl)}
.modal{background:var(--card);border-radius:26px;padding:22px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 8px 0 rgba(23,50,77,.2)}
.modal h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px;line-height:1.1}
.bands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.band{border:2px solid var(--line);background:var(--white);border-radius:16px;padding:10px 6px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.band small{font-weight:700;color:var(--ink-soft);font-size:12px}
.band.on{border-color:var(--plum);background:#efe9fd}
input[type=text],textarea{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;background:var(--white);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.scanner{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#f6e1c4,#b78f6a 60%,#6d523c);display:grid;place-items:center}
.scanner .qr{width:38%;aspect-ratio:1/1;background:var(--white);border-radius:10px;padding:8px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(-4deg)}
.scanner .pg{width:54%;aspect-ratio:3/4;background:#fff8ea;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(3deg);display:grid;place-items:center;padding:8px}
.scanner .pg svg{width:100%;height:auto}
.scanner .line{position:absolute;left:8%;right:8%;height:3px;background:var(--sun);box-shadow:0 0 12px var(--sun);top:10%;animation:scan 1.6s ease-in-out infinite alternate}
.scanner .corner{position:absolute;width:36px;height:36px;border:5px solid var(--white)}
.scanner .c1{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.scanner .c2{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.scanner .c3{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.scanner .c4{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scanner.hit .corner{border-color:var(--good)}
.scanner .msg{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(23,50,77,.8);color:var(--white);padding:4px 12px;border-radius:10px;font-weight:800;font-size:12px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
@keyframes scan{to{top:88%}}
.gate{position:relative;width:120px;height:120px;border-radius:50%;border:0;background:var(--plum);color:var(--white);font-weight:800;margin:6px auto 0;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.gate svg{position:absolute;inset:-8px;width:136px;height:136px;transform:rotate(-90deg)}

.cine{position:fixed;inset:0;pointer-events:none;z-index:30}
.cine .bar{position:absolute;left:0;right:0;height:9vh;background:#0c1b2a}
.cine .bar.t{top:0}.cine .bar.b{bottom:0}
.cine .cap{position:absolute;left:50%;bottom:calc(9vh + 18px);transform:translateX(-50%);width:min(660px,calc(100% - 32px));text-align:center;color:var(--white);font-family:var(--f-display);font-weight:700;font-size:clamp(18px,3.2vw,26px);line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.6);text-wrap:balance}
.cine .cap .ar{display:block;font-size:.8em;color:#bdf3ff;margin-top:4px}
.cine .skip{position:absolute;right:var(--gr);top:calc(9vh + 12px);pointer-events:auto;background:rgba(255,255,255,.85);border:0;border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px}
.cine .tag2{position:absolute;left:var(--gl);top:calc(9vh + 12px);color:var(--white);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cine .tries{position:absolute;left:50%;top:calc(9vh + 14px);transform:translateX(-50%);background:var(--sun);color:var(--ink);font-weight:800;padding:6px 14px;border-radius:14px;font-size:15px}
body.cining .topbar,body.cining .stepper,body.cining .leave,body.cining .ibis{visibility:hidden}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);background:var(--ink);color:var(--white);padding:9px 16px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* dive */
.dive{position:fixed;inset:0;z-index:21;background:#0a2f5c;touch-action:none;user-select:none;-webkit-user-select:none}
.dive canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dhud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 112px);right:var(--gr);display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(220px,46vw)}
.mbox{background:rgba(255,250,240,.94);border-radius:14px;padding:7px 10px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mbox label{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin-bottom:4px}
.dbar{height:12px;border-radius:7px;background:#dfe8ee;overflow:hidden}
.dbar i{display:block;height:100%;border-radius:7px;transition:width .1s linear}
.dbar.breath i{background:linear-gradient(90deg,#ff6b5b,#ffc531 40%,#2fae63)}
.dbar.press i{background:linear-gradient(90deg,#7b4fd6,#ff6b5b)}
.tide{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.tide .arw{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.dctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(420px,calc(100% - 32px))}
.hold{width:100%;padding:20px;font-size:20px;border-radius:22px;touch-action:none}
.hold.down{background:var(--coral);color:#fff;box-shadow:0 2px 0 #b6372b;transform:translateY(2px)}
.dctrl small{color:#cfefff;font-weight:700}
.dmsg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(255,250,240,.96);border-radius:20px;padding:14px 20px;font-family:var(--f-display);font-weight:800;font-size:24px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2);max-width:calc(100% - 40px)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:0;background:var(--card-2);border-radius:14px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--ink);color:var(--white)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.item .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px;color:var(--white)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.15}
.item .tx small{color:var(--ink-soft);font-size:12px}
.item.locked{opacity:.6}
.lyrics{background:#0f3b63;color:#cfefff;border-radius:16px;padding:14px;font-family:var(--f-display);font-size:18px;line-height:1.5}
.lyrics .on{color:var(--sun)}
.gallery{width:100%;height:240px;display:block;border-radius:18px;background:linear-gradient(#bfeaf5,#ffe9f1);touch-action:none}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chr{border:2px solid var(--line);background:var(--white);border-radius:14px;padding:8px;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chr.on{border-color:var(--plum);background:#efe9fd}
.chr[disabled]{opacity:.5}
.chr .sil{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--white);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-soft);font-weight:700;font-size:12px}
.skill{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:13px}
.skill .meter{height:14px}
.skill span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.quote{background:var(--white);border-left:5px solid var(--sea);border-radius:10px;padding:8px 12px}
.quote small{display:block;color:var(--ink-soft);font-size:12px;margin-bottom:2px}
.msgcard{background:#dcf8e6;border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:600;line-height:1.5}
.rec{background:#efe9fd;border-radius:16px;padding:12px 14px}
.reward{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rw{background:var(--white);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px}
.rw .em{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick button{border:2px solid var(--line);background:var(--white);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:12px;min-width:0;line-height:1.25}
.pick button.no{opacity:.45}
.pick svg{width:100%;height:auto;max-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:var(--white);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.tips{display:flex;flex-direction:column;gap:6px}
.tips div{background:#e3f6ea;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<canvas id="stage" aria-label="3D map of the story worlds"></canvas>
<div id="labels"></div>

function playSong({loops=1, onBeat, bpm=96, beats=32}={}){
  const a=ac(); if(!a) return {stop(){}}; stopSong();

  songStop=ctl; return ctl;
}

const tweens=[];
function tween(dur,update,ef=ease){ if(reduceMotion) dur=Math.min(dur,.2); return new Promise(res=>tweens.push({t:0,dur:Math.max(dur,.001),update,ef,res})); }

let last=performance.now(), T=0, paused=false;
const oceanPos=oceanGeo.attributes.position;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  if(!paused){
    for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const p=clamp(tw.t/tw.dur,0,1); tw.update(tw.ef(p),p); if(p>=1){ tweens.splice(i,1); tw.res(); } }
    const a=oceanPos.array; for(let i=0;i<a.length;i+=3){ const x=oceanBase[i], z=oceanBase[i+2]; a[i+1]=Math.sin(x*.14+T*1.1)*.28+Math.cos(z*.11+T*.8)*.28; } oceanPos.needsUpdate=true;
    clouds.forEach((c,i)=>{ c.position.x+=dt*(.6+i*.08); if(c.position.x>90) c.position.x=-90; });
    if(!ibis.userData.busy){ const an=T*.35; ibis.position.set(Math.cos(an)*11, 8+Math.sin(T*1.3)*.5, Math.sin(an)*11); ibis.rotation.y=-an; }
    ibis.userData.wings.forEach((w,i)=>w.rotation.z=(i?1:-1)*Math.sin(T*8)*.6);
    home.userData.flag.rotation.y=Math.sin(T*3)*.25;
    for(const w of WORLDS){ const m=islands[w.id].userData.mist; if(m.visible) m.rotation.y+=dt*.15; }
    const pr=PI_.userData.pearl; if(!pr.userData.free){ pr.position.y=1.05+Math.sin(T*2)*.05; pr.rotation.y=Math.sin(T*.8)*.4; }
    PI_.userData.dhow.position.y=Math.sin(T*1.6)*.1; PI_.userData.dhow.rotation.z=Math.sin(T*1.2)*.05;
    computeGoal();
    if(cine){ cam.pos.copy(cine.pos); cam.look.copy(cine.look); }
    else { const k=1-Math.exp(-dt*(reduceMotion?20:2.6)); cam.pos.lerp(goal.pos,k); cam.look.lerp(goal.look,k); }
    camera.position.copy(cam.pos); camera.lookAt(cam.look);
    renderer.render(scene,camera); updateLabels();
  }
  requestAnimationFrame(loop);
}
